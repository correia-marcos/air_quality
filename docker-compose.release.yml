services:
  analysis:
    build:
      context: .
      target: final
    image: air_quality_replication:v1.0.0
    ports:
      - "8787:8787"
    environment:
      - PASSWORD=replication 
      - USER=rstudio
      - IN_DOCKER=true
    volumes:
      # Declared source inputs are protected; derived products remain writable.
      - ./data/raw:/air_monitoring/data/raw:ro
      - ./data/downloads:/air_monitoring/data/downloads:ro
      - ./data/_legacy:/air_monitoring/data/_legacy:ro
      - ./data/interim:/air_monitoring/data/interim
      - ./data/processed:/air_monitoring/data/processed
      - ./data/validation:/air_monitoring/data/validation
      - ./results:/air_monitoring/results
